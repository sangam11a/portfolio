        <h1>Sangam Thapa — Satellite OBC Lead, Edge AI & Embedded Systems Engineer</h1>
        <p>Computer Engineer, On-Board Computer (OBC) Lead for <strong>Slippers2Sat (Nepal's first middle school CubeSat)</strong> at <strong>Antarikchya Pratisthan Nepal (Nepal Space Foundation)</strong>, and Machine Learning Engineer specializing in Edge AI, Computer Vision, NLP Transformers, and Embedded Systems & PCB Design.</p>
        
        <h2>Key Engineering Projects & Roles</h2>
        <ul>
          <li><strong>Slippers2Sat On-Board Computer (OBC) Lead:</strong> Leading avionics, flight software, and hardware design for Nepal's first middle school CubeSat project by Antarikchya Pratisthan Nepal (Nepal Space Foundation).</li>
          <li><strong>CubeOS Architect:</strong> Designed a modular, PX4-inspired CubeSat flight software system on NuttX RTOS presented at the 75th International Astronautical Congress (IAC 2024, Milan).</li>
          <li><strong>Prasta Nepali NLP:</strong> Developed transformer-based grammatical error correction for Nepali, published at IEEE ICICT 2025.</li>
          <li><strong>Agricultural Computer Vision:</strong> Evaluated YOLOv12S, DETR, and Faster R-CNN for real-time edge detection, published at IEEE ICICT 2025.</li>
        </ul>

        <h2>Publications & Research</h2>
        <ul>
          <li><strong>CubeOS:</strong> A PX4 Autopilot-inspired flight software for Nepal's next-generation CubeSat bus — <em>75th IAC 2024 (Milan, Italy)</em></li>
          <li><strong>Prasta Nepali:</strong> A Transformer based Approach for Automated Nepali Grammar (Byakaran) Error Detection and Correction — <em>IEEE ICICT 2025 (DOI: 10.1109/ICICT64420.2025.11004703)</em></li>
          <li><strong>Detection of Seismo-Electromagnetic Waves:</strong> Non-Boom Quad-Mag Technology on Nepal's 1U Slippers2Sat CubeSat — <em>32nd IAA / IAC 2025</em></li>
          <li><strong>Comparative Study of Object Detection Models:</strong> Faster R-CNN, DETR, YOLOv8, and YOLOv12S — <em>IEEE ICICT 2025 (DOI: 10.1109/ICICT64420.2025.11005373)</em></li>
          <li><strong>On-Chip Digipeater for Disaster Communication:</strong> Slippers2Sat Middle School CubeSat — <em>76th IAC 2025</em></li>
        </ul>
